name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # pinned: a newer stable can refuse the project's Android Gradle
          # Plugin, and a release must build with what was tested (3.50 did)
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The panel is arm64; one APK is all it needs, and one is all we keep.
      - run: flutter build apk --release --split-per-abi
      - run: cd android && ./gradlew :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: nspanel-app-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
